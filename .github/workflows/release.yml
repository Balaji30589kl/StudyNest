name: Release

# Push a tag like v0.3.0 (matching package.json) to build the Windows installer
# and create a draft GitHub Release. Publishing the draft makes it available to
# auto-update.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - run: npm run verify
      - run: npm run test:e2e

      - name: Build installer and publish draft release
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the packaged app
        run: node e2e/run.mjs packaged

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studynest-windows
          path: |
            release/*/*.exe
            release/*/latest.yml
            e2e-output
          retention-days: 14
